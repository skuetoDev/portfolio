<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SkuetoDev</title>
  <script>
    // GitHub Pages SPA redirect — rafgraph/spa-github-pages
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
