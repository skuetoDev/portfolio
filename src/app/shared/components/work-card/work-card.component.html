<article class="work-card">

  <!-- Media -->
  <div class="work-card__media">
    @if (work.mediaType === 'video') {
      <video [src]="work.mediaUrl | safeUrl" muted loop playsinline
             (mouseenter)="$any($event.target).play()"
             (mouseleave)="$any($event.target).pause()">
      </video>
    } @else {
      <img [src]="work.mediaUrl | safeUrl" [alt]="work.title" loading="lazy" />
    }
    <div class="work-card__overlay">
      <span class="work-card__view-label">Ver proyecto</span>
    </div>
  </div>

  <!-- Contenido -->
  <div class="work-card__body">
    <h3 class="work-card__title">{{ work.title }}</h3>
    <p class="work-card__desc">{{ description | truncate:100:'… leer más' }}</p>

    <!-- Tecnologías -->
    <div class="work-card__techs">
      @for (tech of work.technologies; track tech.name) {
        <app-tech-badge [technology]="tech" />
      }
    </div>
  </div>

</article>
