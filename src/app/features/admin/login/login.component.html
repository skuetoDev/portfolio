<div class="login-page" [style.background-image]="heroBg">

  <div class="login-card">

    <!-- Header -->
    <div class="login-card__header">
      <div class="login-card__logo">
        <span class="logo-symbol">&lt;</span>
        <span class="logo-name">Skueto</span>
        <span class="logo-symbol">Dev/&gt;</span>
      </div>
      <h1>Área de administración</h1>
      <p>Acceso restringido</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <!-- Error global -->
      @if (error()) {
        <div class="form-error-banner">
          <span>⚠</span> {{ error() }}
        </div>
      }

      <!-- Email -->
      <div class="form-field" [class.invalid]="f['email'].invalid && f['email'].touched">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="admin@email.com"
            autocomplete="email"
          />
        </div>
        @if (f['email'].invalid && f['email'].touched) {
          <span class="field-error">Email no válido</span>
        }
      </div>

      <!-- Contraseña -->
      <div class="form-field" [class.invalid]="f['password'].invalid && f['password'].touched">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <input
            id="password"
            [type]="showPass() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pass" (click)="togglePass()">
            @if (showPass()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
        @if (f['password'].invalid && f['password'].touched) {
          <span class="field-error">Mínimo 6 caracteres</span>
        }
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          Entrando...
        } @else {
          Entrar
        }
      </button>

    </form>

  </div>

</div>
