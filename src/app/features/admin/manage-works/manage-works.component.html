<!-- ANTES: subida de archivo -->
<!-- AHORA: input de URL directa -->
<div class="form-field">
  <label>URL de imagen o video</label>
  <input
    type="url"
    formControlName="mediaUrl"
    placeholder="https://i.imgur.com/ejemplo.jpg"
  />
  <span class="field-hint">
    💡 Puedes usar Imgur, Cloudinary, o cualquier URL pública de imagen/video
  </span>

  <!-- Preview automático cuando hay URL -->
  @if (form.get('mediaUrl')?.value) {
    <div class="media-preview">
      @if (form.get('mediaType')?.value === 'video') {
        <video [src]="form.get('mediaUrl')?.value" muted controls></video>
      } @else {
        <img [src]="form.get('mediaUrl')?.value" alt="preview"
             (error)="$any($event.target).style.display='none'" />
      }
    </div>
  }

  <!-- Selector tipo -->
  <div class="media-type-toggle">
    <label class="radio-label">
      <input type="radio" formControlName="mediaType" value="image" />
      <span>Imagen</span>
    </label>
    <label class="radio-label">
      <input type="radio" formControlName="mediaType" value="video" />
      <span>Video</span>
    </label>
  </div>
</div>
